function Room(code){
  const subs=new Set(),peers=new Map(),conns=new Map();
  let peer=null,hostConn=null,dead=false,started=false,mine=null,gen=0;

  const emit=(left,joined)=>{const ch={peers:[{peer:ME,isMe:true,sameTab:true,kind:'viewer',by:ME,presence:mine}].concat([...peers].map(([id,d])=>({peer:id,isMe:false,sameTab:false,kind:'viewer',by:id,presence:d}))),
    left:(left||[]).map(p=>({peer:p})),joined:(joined||[]).map(p=>({peer:p}))};subs.forEach(f=>f(ch))};
  const relay=(m,except)=>conns.forEach((c,id)=>{if(id!==except&&c.open)try{c.send(m)}catch(e){}});
  const snap=()=>{const o={};peers.forEach((d,id)=>o[id]=d);o[ME]=mine||{};return o};
  function teardown(){gen++;try{peer&&peer.destroy()}catch(e){}peer=null;hostConn=null;conns.clear();
    const gone=[...peers.keys()];peers.clear();if(gone.length)emit(gone)}
  function retry(g){if(dead||g!==gen)return;teardown();setTimeout(start,400+Math.random()*1600)}
  function asClient(){
    const g=++gen;const pr=peer=new Peer();
    pr.on('error',()=>retry(g));pr.on('disconnected',()=>{if(g===gen&&!pr.destroyed)try{pr.reconnect()}catch(e){}});
    pr.on('open',()=>{const c=hostConn=pr.connect(hid,{reliable:true});
      c.on('open',()=>{c.send({t:'p',id:ME,d:mine||{}})});
      c.on('data',m=>{
        if(m.t==='snap'){const old=new Set(peers.keys()),j=[];peers.clear();for(const id in m.s)if(id!==ME){peers.set(id,m.s[id]);if(!old.has(id))j.push(id)}
          const l=[...old].filter(id=>!peers.has(id));emit(l,j)}
        else if(m.t==='p'&&m.id!==ME){const had=peers.has(m.id);peers.set(m.id,m.d);emit([],had?[]:[m.id])}
        else if(m.t==='l'){if(peers.delete(m.id))emit([m.id])}});
      c.on('close',()=>retry(g));c.on('error',()=>retry(g))})}

    if(dead)return;started=true;const g=++gen;const pr=peer=new Peer(hid);
    pr.on('error',e=>{if(g!==gen)return;if(e.type==='unavailable-id'){try{pr.destroy()}catch(_){}asClient()}else retry(g)});
    pr.on('disconnected',()=>{if(g===gen&&!pr.destroyed)try{pr.reconnect()}catch(e){}});
    pr.on('connection',c=>{let cid=null;
      c.on('open',()=>c.send({t:'snap',s:snap()}));
      c.on('data',m=>{if(m.t!=='p')return;if(!cid){cid=m.id;conns.set(cid,c)}
        const had=peers.has(cid);peers.set(cid,m.d);emit([],had?[]:[cid]);relay(m,cid)});
      c.on('close',()=>{if(cid&&conns.get(cid)===c){conns.delete(cid);peers.delete(cid);emit([cid]);relay({t:'l',id:cid},cid)}})})}
  return{
    onPeers(f){subs.add(f);if(!started)start();setTimeout(()=>emit(),0);return()=>subs.delete(f)},
    presence(d){mine=d;const m={t:'p',id:ME,d};if(conns.size)relay(m);else if(hostConn&&hostConn.open)try{hostConn.send(m)}catch(e){};return Promise.resolve()},
    leave(){dead=true;teardown();return Promise.resolve()},
    join:async c=>Room(c)
  }}
const lobby=Room('lobby');
window.claude={use:async n=>n==='room'?lobby:n==='user'?{profiles:async ids=>{const o={};for(const id of ids){let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;o[id]={name:NAMES[h%NAMES.length]}}return o}}:null};
})();

  const q=t%5;ears.forEach((e,i)=>e.rotation.z=e.userData.base+(i===0&&q>4.6?Math.sin((q-4.6)*35)*.22:0));

  tgt.x+=(st.x-tgt.x)*Math.min(1,dt*6);tgt.z+=(st.z-tgt.z)*Math.min(1,dt*6);tgt.y+=(.52+fl-tgt.y)*Math.min(1,dt*4);
  cam.position.set(tgt.x+R*Math.sin(ph)*Math.sin(th),tgt.y+R*Math.cos(ph),tgt.z+R*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
